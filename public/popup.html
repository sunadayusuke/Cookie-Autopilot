<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cookie Autopilot</title>
    <!-- Gen Interface JP — 既存プロダクトで使っている CDN URL をそのまま使用 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-interface-jp@latest/cdn/400.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-interface-jp@latest/cdn/500.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-interface-jp@latest/cdn/600.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-interface-jp@latest/cdn/700.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-interface-jp@latest/cdn/display-700.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <p id="extension-notice" class="notice" hidden>
        拡張として読み込むと有効になります。ここでは見た目だけ確認できます。
      </p>

      <div id="onboarding-notice" class="notice notice-action" hidden>
        <span>最初の設定がまだです</span>
        <button type="button" id="onboarding-btn" class="btn btn-primary btn-sm">設定する</button>
      </div>

      <div id="popup-body" class="popup-body">
        <header class="popup-header">
          <h1 id="site-name" class="site-name">&nbsp;</h1>
          <span id="status-badge" class="badge badge-neutral" role="status" aria-live="polite">確認しています…</span>
        </header>

        <section id="result-section" class="panel-section panel-section-border">
          <h2 class="section-title">このサイトでの結果</h2>
          <p id="result-message" class="result-message"></p>
          <p id="result-hint" class="result-hint" hidden></p>
          <div id="result-chips" class="result-chips" hidden>
            <div class="result-chip-group">
              <span class="result-chip-label">許可</span>
              <div id="result-allow-chips" class="chip-row"></div>
            </div>
            <div class="result-chip-group">
              <span class="result-chip-label">拒否</span>
              <div id="result-deny-chips" class="chip-row"></div>
            </div>
          </div>
        </section>

        <!-- このサイトの設定（§14.9）: ControlRow を丸ごとボタンにして詳細へドリルダウンする -->
        <section id="site-section" class="panel-section panel-section-border">
          <button
            type="button"
            id="site-settings-btn"
            class="control-row row-button"
            aria-expanded="false"
            aria-controls="site-detail"
          >
            <span class="control-row-label">このサイトの設定</span>
            <span id="site-settings-summary" class="row-button-summary"></span>
            <span class="row-button-chevron" aria-hidden="true">›</span>
          </button>
        </section>
      </div>

      <!-- このサイトの設定（詳細。§14.9）。開いている間はメインの内容を隠す -->
      <section id="site-detail" class="site-detail" aria-labelledby="site-detail-title" hidden>
        <header class="site-detail-header">
          <button type="button" id="site-detail-back" class="btn btn-ghost btn-sm site-detail-back">← 戻る</button>
          <h2 id="site-detail-title" class="site-detail-title">このサイトの設定</h2>
          <p id="site-detail-host" class="site-detail-host"></p>
        </header>

        <div id="site-category-slot"></div>

        <div class="site-detail-off">
          <span class="site-detail-off-label">このサイトでは動かさない</span>
          <button type="button" id="site-off-toggle" class="toggle" role="switch" aria-checked="false" aria-label="このサイトでは動かさない">
            <span class="toggle-thumb"></span>
          </button>
        </div>

        <div class="site-detail-footer">
          <button type="button" id="site-reset" class="btn btn-outline site-detail-reset">全体の設定に戻す</button>
          <p class="site-detail-note">変えた内容はこのサイトだけに効きます。</p>
        </div>
      </section>

      <div id="hud" class="hud" role="status" aria-live="assertive" hidden></div>

      <footer id="popup-footer" class="popup-footer">
        <div id="action-buttons" class="footer-actions">
          <button type="button" id="teach-reject" class="push-btn push-btn-dark">断るボタンを教える</button>
          <button type="button" id="rerun" class="btn btn-ghost btn-sm footer-rerun">このページで再実行</button>
        </div>
        <a href="options.html" id="options-link" class="footer-link" target="_blank" rel="noreferrer">詳細設定 →</a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
