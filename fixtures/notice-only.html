<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>fixture: 選択肢のない通知バナー</title>
    <script src="/content.js"></script>
    <style>
      body { margin: 0; font: 15px/1.8 system-ui, -apple-system, 'Hiragino Sans', sans-serif; }
      main { padding: 24px; max-width: 720px; }
      pre { background: #f3f4f6; padding: 12px; border-radius: 8px; min-height: 3em; }
      .fx-cookie-toast {
        position: fixed; right: 24px; bottom: 24px; width: 320px;
        padding: 20px; background: #fff; border: 1px solid #d1d5db; border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }
      .fx-cookie-toast button { margin-top: 12px; padding: 10px 24px; border: 0; border-radius: 8px; background: #111827; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>選択肢のない通知バナー</h1>
      <p>決定ボタンが 1 つだけで、それが「閉じる語」なのでどちらのモードでも押されます。</p>
      <pre id="log"></pre>
    </main>

    <div class="fx-cookie-toast" id="fx-cookie-toast">
      <p>このサイトは Cookie を使用しています。閲覧を続けると同意したものとみなされます。</p>
      <button type="button">OK</button>
    </div>

    <script>
      (function () {
        var log = document.getElementById('log');
        function record(text) {
          log.textContent += '[' + new Date().toLocaleTimeString('ja-JP') + '] ' + text + '\n';
        }
        document.addEventListener(
          'click',
          function (event) {
            var el = event.target.closest('button, a, [role="button"], input');
            if (el) record('クリック: ' + (el.textContent || el.value || '').trim());
          },
          true,
        );
        var toast = document.getElementById('fx-cookie-toast');
        toast.querySelector('button').addEventListener('click', function () {
          record('バナーを閉じました');
          toast.remove();
        });
      })();
    </script>
  </body>
</html>
