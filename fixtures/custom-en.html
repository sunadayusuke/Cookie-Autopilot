<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fixture: 独自実装の英語バナー</title>
    <script src="/content.js"></script>
    <style>
      body { margin: 0; font: 15px/1.8 system-ui, -apple-system, 'Hiragino Sans', sans-serif; }
      main { padding: 24px; max-width: 720px; }
      pre { background: #f3f4f6; padding: 12px; border-radius: 8px; min-height: 3em; }
      .fx-cookie-bar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
        display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        padding: 20px 24px; background: #111827; color: #f9fafb;
      }
      .fx-cookie-bar p { margin: 0; flex: 1 1 320px; }
      .fx-cookie-bar button { padding: 10px 16px; border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; }
      .fx-allow { background: #2563eb; color: #fff; }
      .fx-deny { background: #e5e7eb; color: #111827; }
      .fx-config { background: transparent; color: #93c5fd; text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>独自実装の英語バナー</h1>
      <p>reject モードでは「Reject non-essential」が、accept モードでは「Accept all cookies」が押されます。</p>
      <p><code>?mode=accept</code> を付けると accept モードになります。</p>
      <pre id="log"></pre>
    </main>

    <div class="fx-cookie-bar" id="fx-cookie-bar-en">
      <p>We use cookies to improve your experience, analyse traffic and personalise content.</p>
      <button class="fx-allow">Accept all cookies</button>
      <button class="fx-deny">Reject non-essential</button>
      <button class="fx-config">Cookie settings</button>
    </div>

    <script>
      (function () {
        var log = document.getElementById('log');
        function record(text) {
          log.textContent += '[' + new Date().toLocaleTimeString('ja-JP') + '] ' + text + '\n';
        }
        document.addEventListener(
          'click',
          function (event) {
            var el = event.target.closest('button, a, [role="button"], input');
            if (el) record('クリック: ' + (el.textContent || el.value || '').trim());
          },
          true,
        );
        var banner = document.getElementById('fx-cookie-bar-en');
        banner.addEventListener('click', function (event) {
          var el = event.target.closest('button');
          if (!el || el.classList.contains('fx-config')) return;
          record('バナーを閉じました');
          banner.remove();
        });
      })();
    </script>
  </body>
</html>
