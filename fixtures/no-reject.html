<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>fixture: 拒否ボタンが無いバナー</title>
    <script src="/content.js"></script>
    <style>
      body { margin: 0; font: 15px/1.8 system-ui, -apple-system, 'Hiragino Sans', sans-serif; }
      main { padding: 24px; max-width: 720px; }
      pre { background: #f3f4f6; padding: 12px; border-radius: 8px; min-height: 3em; }
      .fx-cookie-bar {
        position: fixed; left: 0; right: 0; bottom: 0; padding: 20px 24px;
        background: #0f172a; color: #f8fafc; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
      }
      .fx-cookie-bar p { margin: 0; flex: 1 1 320px; }
      .fx-cookie-bar button { padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>拒否ボタンが無いバナー</h1>
      <p>
        reject モードでは押せるボタンが無いので、既定の fallback（<code>hide</code>）で
        容器に <code>display: none</code> が付きます。<code>?mode=accept</code> では「同意する」が押されます。
      </p>
      <pre id="log"></pre>
    </main>

    <div class="fx-cookie-bar" id="fx-cookie-bar">
      <p>Cookie の利用に同意いただくと、より便利にご利用いただけます。</p>
      <button class="fx-agree">同意する</button>
      <button class="fx-config">設定</button>
    </div>

    <script>
      (function () {
        var log = document.getElementById('log');
        function record(text) {
          log.textContent += '[' + new Date().toLocaleTimeString('ja-JP') + '] ' + text + '\n';
        }
        document.addEventListener(
          'click',
          function (event) {
            var el = event.target.closest('button, a, [role="button"], input');
            if (el) record('クリック: ' + (el.textContent || el.value || '').trim());
          },
          true,
        );
        var bar = document.getElementById('fx-cookie-bar');
        bar.querySelector('.fx-agree').addEventListener('click', function () {
          record('バナーを閉じました');
          bar.remove();
        });
      })();
    </script>
  </body>
</html>
