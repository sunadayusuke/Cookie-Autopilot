<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>fixture: Consent-O-Matic ルール（cookiebot）</title>
    <script src="/content.js"></script>
    <style>
      body { margin: 0; font: 15px/1.8 system-ui, -apple-system, 'Hiragino Sans', sans-serif; }
      main { padding: 24px; max-width: 720px; }
      pre { background: #f3f4f6; padding: 12px; border-radius: 8px; min-height: 5em; }
      #CybotCookiebotDialog {
        position: fixed; left: 50%; top: 40px; transform: translateX(-50%);
        width: 480px; padding: 24px; background: #fff; border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      #CybotCookiebotDialog button { margin-right: 8px; padding: 10px 16px; border: 1px solid #111827; border-radius: 4px; background: #fff; cursor: pointer; }
      #CybotCookiebotDialogDetails[hidden] { display: none; }
      #CybotCookiebotDialogDetails label { display: block; }
    </style>
  </head>
  <body>
    <main>
      <h1>Consent-O-Matic ルール（cookiebot）の DOM を模したページ</h1>
      <p>
        解釈器が <code>OPEN_OPTIONS</code>（詳細を開く）→ <code>DO_CONSENT</code>（チェックを外す）→
        <code>SAVE_CONSENT</code>（選択を保存）の順に実行することを確認できます。
      </p>
      <pre id="log"></pre>
    </main>

    <div id="CybotCookiebotDialog">
      <p>このウェブサイトは Cookie を使用しています。</p>
      <button id="CybotCookiebotDialogBodyLevelButtonCustomize">詳細を表示</button>
      <button id="CybotCookiebotDialogBodyButtonAccept">すべて許可</button>

      <div id="CybotCookiebotDialogDetails" hidden>
        <label>
          <input type="checkbox" id="CybotCookiebotDialogBodyLevelButtonPreferences" name="preferences" checked />
          設定・機能
        </label>
        <label>
          <input type="checkbox" id="CybotCookiebotDialogBodyLevelButtonStatistics" name="statistics" checked />
          統計
        </label>
        <label>
          <input type="checkbox" id="CybotCookiebotDialogBodyLevelButtonMarketing" name="marketing" checked />
          マーケティング
        </label>
        <button id="CybotCookiebotDialogBodyButtonAcceptSelected">選択を許可</button>
      </div>
    </div>

    <script>
      (function () {
        var log = document.getElementById('log');
        function record(text) {
          log.textContent += '[' + new Date().toLocaleTimeString('ja-JP') + '] ' + text + '\n';
        }
        document.addEventListener(
          'click',
          function (event) {
            var el = event.target.closest('button, a, [role="button"], input');
            if (!el) return;
            if (el.type === 'checkbox') {
              record('チェックボックス: ' + el.name + ' -> ' + (el.checked ? 'on' : 'off'));
              return;
            }
            record('クリック: ' + (el.textContent || el.value || '').trim());
          },
          true,
        );

        var dialog = document.getElementById('CybotCookiebotDialog');
        var details = document.getElementById('CybotCookiebotDialogDetails');
        document.getElementById('CybotCookiebotDialogBodyLevelButtonCustomize').addEventListener('click', function () {
          details.hidden = false;
          record('詳細を開きました');
        });
        function close(label) {
          record(label + ' -> バナーを閉じました');
          dialog.remove();
        }
        document.getElementById('CybotCookiebotDialogBodyButtonAcceptSelected').addEventListener('click', function () {
          close('選択を許可');
        });
        document.getElementById('CybotCookiebotDialogBodyButtonAccept').addEventListener('click', function () {
          close('すべて許可');
        });
      })();
    </script>
  </body>
</html>
