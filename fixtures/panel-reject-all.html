<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>fixture: 設定パネルの中に「全て拒否」がある</title>
    <script src="/content.js"></script>
    <style>
      body { margin: 0; font: 15px/1.8 system-ui, -apple-system, 'Hiragino Sans', sans-serif; }
      main { padding: 24px; max-width: 720px; }
      pre { background: #f3f4f6; padding: 12px; border-radius: 8px; min-height: 3em; }
      .fx-cookie-bar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
        display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        padding: 20px 24px; background: #111827; color: #f9fafb;
      }
      .fx-cookie-bar p { margin: 0; flex: 1 1 320px; }
      .fx-cookie-bar button { padding: 10px 16px; border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; }
      .fx-agree { background: #2563eb; color: #fff; }
      .fx-config { background: #e5e7eb; color: #111827; }
      .fx-cookie-prefs {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20;
        width: 520px; max-width: calc(100vw - 48px); padding: 24px;
        background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .fx-cookie-prefs[hidden] { display: none; }
      .fx-cookie-prefs h2 { margin: 0 0 12px; font-size: 18px; }
      .fx-cookie-prefs ul { list-style: none; margin: 0 0 20px; padding: 0; }
      .fx-cookie-prefs li { padding: 10px 0; border-top: 1px solid #e5e7eb; }
      .fx-cookie-prefs label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
      .fx-actions { display: flex; gap: 12px; }
      .fx-actions button { padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; }
      .fx-reject-all { background: #111827; color: #fff; }
      .fx-save { background: #e5e7eb; color: #111827; }
    </style>
  </head>
  <body>
    <main>
      <h1>設定パネルの中に「全て拒否」がある</h1>
      <p>
        「設定」を押して開いたパネルに「全て拒否」があるので、<strong>トグルには一切触れず</strong>
        それを押すのが正解です（そちらの方が確実で安全）。
      </p>
      <p><code>?mode=accept</code> を付けると「全てに同意する」が押されます。</p>
      <pre id="log"></pre>
    </main>

    <div class="fx-cookie-bar" id="fx-cookie-bar">
      <p>当サイトでは Cookie を使用しています。用途ごとの設定は「設定」からご確認ください。</p>
      <button class="fx-agree">全てに同意する</button>
      <button class="fx-config">設定</button>
    </div>

    <div class="fx-cookie-prefs" id="fx-cookie-prefs" role="dialog" aria-modal="true" hidden>
      <h2>Cookie の設定</h2>
      <ul>
        <li><label><input type="checkbox" id="fx-functional" checked /> 機能 Cookie</label></li>
        <li><label><input type="checkbox" id="fx-analytics" checked /> 分析 Cookie</label></li>
        <li><label><input type="checkbox" id="fx-ads" checked /> 広告 Cookie</label></li>
      </ul>
      <div class="fx-actions">
        <button class="fx-reject-all">全て拒否</button>
        <button class="fx-save">選択を保存</button>
      </div>
    </div>

    <script>
      (function () {
        var log = document.getElementById('log');
        function record(text) {
          log.textContent += '[' + new Date().toLocaleTimeString('ja-JP') + '] ' + text + '\n';
        }
        document.addEventListener(
          'click',
          function (event) {
            var el = event.target.closest('button, a, [role="button"], input');
            if (el && el.type !== 'checkbox') record('クリック: ' + (el.textContent || el.value || '').trim());
          },
          true,
        );

        var bar = document.getElementById('fx-cookie-bar');
        var prefs = document.getElementById('fx-cookie-prefs');

        bar.querySelector('.fx-config').addEventListener('click', function () {
          prefs.hidden = false;
          record('設定パネルを開きました');
        });
        bar.querySelector('.fx-agree').addEventListener('click', function () {
          record('全てに同意してバナーを閉じました');
          bar.remove();
          prefs.remove();
        });

        prefs.addEventListener('change', function (event) {
          var input = event.target;
          if (!input.id) return;
          var label = input.closest('label');
          record('トグル（本来は起きないはず）: ' + (label ? label.textContent.trim() : input.id));
        });
        function close(text) {
          record(text);
          prefs.remove();
          bar.remove();
        }
        prefs.querySelector('.fx-reject-all').addEventListener('click', function () {
          close('全て拒否 -> バナーとパネルを閉じました');
        });
        prefs.querySelector('.fx-save').addEventListener('click', function () {
          close('選択を保存 -> バナーとパネルを閉じました');
        });
      })();
    </script>
  </body>
</html>
