<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>fixture: Cookie 画面ではない会員設定モーダル</title>
    <script src="/content.js"></script>
    <style>
      body { margin: 0; font: 15px/1.8 system-ui, -apple-system, 'Hiragino Sans', sans-serif; }
      main { padding: 24px; max-width: 720px; }
      pre { background: #f3f4f6; padding: 12px; border-radius: 8px; min-height: 3em; }
      .fx-member-modal {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20;
        width: 520px; max-width: calc(100vw - 48px); padding: 24px;
        background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .fx-member-modal h2 { margin: 0 0 12px; font-size: 18px; }
      .fx-member-modal ul { list-style: none; margin: 0 0 16px; padding: 0; }
      .fx-member-modal li { padding: 8px 0; border-top: 1px solid #e5e7eb; }
      .fx-member-modal label { display: flex; gap: 8px; align-items: center; }
      .fx-member-modal input[type='text'] { width: 100%; box-sizing: border-box; padding: 8px; }
      .fx-actions { display: flex; gap: 12px; margin-top: 16px; }
      .fx-actions button { padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; }
      .fx-open { background: #e5e7eb; color: #111827; }
      .fx-store { background: #111827; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cookie 画面ではない会員設定モーダル</h1>
      <p>
        Cookie の語が無く、入力欄のある会員向けのモーダルです。「設定」ボタンとトグルがありますが、
        <strong>何も押されず、非表示にもされない</strong>のが正解です（reject / accept どちらでも）。
      </p>
      <pre id="log"></pre>
    </main>

    <div class="fx-member-modal" id="fx-member-modal" role="dialog" aria-modal="true">
      <h2>プライバシー設定</h2>
      <label for="fx-nickname">表示名</label>
      <input type="text" id="fx-nickname" value="example" />
      <ul>
        <li><label><input type="checkbox" id="fx-newsletter" checked /> お知らせメールを受け取る</label></li>
        <li><label><input type="checkbox" id="fx-profile" checked /> プロフィールを公開する</label></li>
      </ul>
      <div class="fx-actions">
        <button class="fx-open">設定</button>
        <button class="fx-store">変更を反映</button>
      </div>
    </div>

    <script>
      (function () {
        var log = document.getElementById('log');
        function record(text) {
          log.textContent += '[' + new Date().toLocaleTimeString('ja-JP') + '] ' + text + '\n';
        }
        document.addEventListener(
          'click',
          function (event) {
            var el = event.target.closest('button, a, [role="button"], input');
            if (el) record('クリック（本来は起きないはず）: ' + (el.textContent || el.value || '').trim());
          },
          true,
        );
        document.addEventListener('change', function (event) {
          record('トグル（本来は起きないはず）: ' + event.target.id);
        });
        record('待機中。モーダルが変わらなければ成功です。');
      })();
    </script>
  </body>
</html>
